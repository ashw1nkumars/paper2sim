[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses callables (Form/File/Depends) as argument defaults by design.
"api/papers.py" = ["B008"]
# These modules embed long prose prompts and a generated code template.
"services/llm/mock.py" = ["E501"]
"services/llm/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
